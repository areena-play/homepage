<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="404 — Page Not Found | AREENA">
  <meta name="theme-color" content="#0a0d14">
  <title>404 — Page Not Found | AREENA</title>
  
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.svg">
  
  <!-- Reusable Zero-Flash Theme & Language Initializer Component -->
  <component name="head-init"></component>

  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Reusable Navigation Bar Component -->
  <component name="navbar"></component>

  <!-- Page Main Content -->
  <main class="page-container" style="text-align: center; margin: clamp(2.5rem, 6vw, 4.5rem) auto;">
    <div style="font-size: clamp(4.5rem, 15vw, 7rem); font-weight: 900; line-height: 1; margin-bottom: 0.75rem;" class="gradient-text">
      404
    </div>
    <h1 style="font-size: clamp(1.75rem, 4vw, 2.5rem); margin-bottom: 0.75rem;" data-i18n="notFound.heading">Lost in the Arena?</h1>
    <p style="color: var(--text-secondary); max-width: 540px; margin: 0 auto 2rem auto; font-size: clamp(0.95rem, 2vw, 1.1rem);" data-i18n="notFound.description">
      The page you are looking for might have been moved, removed, or is temporarily unavailable.
    </p>

    <div style="display: flex; justify-content: center; gap: 1rem;">
      <a href="/" class="btn btn-primary" data-i18n="notFound.backHome">Back to Home</a>
    </div>
  </main>

  <!-- Reusable Footer Component -->
  <component name="footer"></component>

  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
