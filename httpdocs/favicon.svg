<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Red glowing gradient for ball -->
    <radialGradient id="redBallGrad" cx="38%" cy="36%" r="64%">
      <stop offset="0%" stop-color="#FF5A45"/>
      <stop offset="55%" stop-color="#E23828"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </radialGradient>
    
    <!-- Arena Stadium Lighting -->
    <linearGradient id="stadiumDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Filter for subtle drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Stadium Arena Background Badge (Rounded Shield / Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#stadiumDark)" stroke="#334155" stroke-width="8" filter="url(#shadow)"/>

  <!-- Arena Court Lines / Center Arena Ring -->
  <circle cx="256" cy="256" r="160" stroke="#334155" stroke-width="4" stroke-dasharray="8 8" opacity="0.35"/>

  <!-- LEFT 'E' (Seamless unified arena path, facing right) -->
  <path d="
    M 238 136
    L 238 176
    L 180 176
    C 152 176, 136 190, 136 212
    L 136 236
    L 196 236
    L 196 276
    L 136 276
    L 136 300
    C 136 322, 152 336, 180 336
    L 238 336
    L 238 376
    L 180 376
    C 136 376, 98 350, 98 316
    C 90 278, 90 234, 98 196
    C 98 162, 136 136, 180 136
    Z
  " fill="#FFFFFF"/>

  <!-- RIGHT 'E' (Mirrored Ǝ - Seamless unified arena path, facing left) -->
  <path d="
    M 274 136
    L 274 176
    L 332 176
    C 360 176, 376 190, 376 212
    L 376 236
    L 316 236
    L 316 276
    L 376 276
    L 376 300
    C 376 322, 360 336, 332 336
    L 274 336
    L 274 376
    L 332 376
    C 376 376, 414 350, 414 316
    C 422 278, 422 234, 414 196
    C 414 162, 376 136, 332 136
    Z
  " fill="#FFFFFF"/>

  <!-- CENTER AREENA RED BALL (The core of the Arena, without reflection) -->
  <circle cx="256" cy="256" r="44" fill="url(#redBallGrad)" filter="url(#shadow)"/>
</svg>

