<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Modern Geometric Arena Icon -->
  <g transform="translate(10, 10)">
    <polygon points="40,5 75,25 75,65 40,85 5,65 5,25" fill="none" stroke="url(#primaryGradient)" stroke-width="4" filter="url(#glow)"/>
    <polygon points="40,18 63,31 63,59 40,72 17,59 17,31" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.7"/>
    <circle cx="40" cy="45" r="10" fill="url(#primaryGradient)" filter="url(#glow)"/>
    <circle cx="40" cy="45" r="4" fill="#ffffff"/>
  </g>
  <!-- AREENA Typography -->
  <text x="110" y="62" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="6" fill="#ffffff">
    AREENA
  </text>
  <circle cx="340" cy="55" r="5" fill="#00f2fe" filter="url(#glow)" />
</svg>

