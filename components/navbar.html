<!-- Reusable Navigation Bar Component -->
<header class="navbar" id="site-navbar">
  <div class="container nav-container">
    <a href="{{rootHref}}" class="brand-logo" aria-label="AREENA Homepage">
      <!-- Dark Theme Logo (White text for dark background) -->
      <img src="/assets/areena-logo-dark.png" alt="AREENA Logo" class="logo-dark-theme">
      <!-- Light Theme Logo (Black text for light background) -->
      <img src="/assets/areena-logo.png" alt="AREENA Logo" class="logo-light-theme">
    </a>

    <!-- Navigation Links -->
    <nav>
      <ul class="nav-links" id="nav-links">
        <li class="nav-item"><a href="{{prefix}}#home" class="{{activeHome}}" data-i18n="nav.home">Home</a></li>
        <li class="nav-item"><a href="/swiss-table-tennis" style="color: var(--accent-cyan); font-weight: 600;" data-i18n="nav.stt">Swiss Table Tennis 🏓</a></li>
        <li class="nav-item"><a href="{{prefix}}#status" data-i18n="nav.status">Status</a></li>
        <li class="nav-item"><a href="{{prefix}}#project" data-i18n="nav.project">Project</a></li>
        <li class="nav-item"><a href="{{prefix}}#features" data-i18n="nav.features">Features</a></li>
        <li class="nav-item"><a href="{{prefix}}#partners" data-i18n="nav.partners">Partners</a></li>
        <li class="nav-item"><a href="{{prefix}}#team" data-i18n="nav.team">Team</a></li>
        <li class="nav-item"><a href="{{prefix}}#contact" data-i18n="nav.contact">Contact</a></li>
      </ul>
    </nav>

    <!-- Nav Actions & Controls -->
    <div class="nav-actions">
      <!-- Theme Toggle (Light / Dark) -->
      <button class="theme-btn" id="theme-toggle" aria-label="Toggle Theme" title="Toggle Theme">🌙</button>

      <!-- Language Switcher -->
      <div class="lang-selector">
        <button class="lang-btn" id="lang-btn" aria-label="Change Language" aria-haspopup="true">
          <span id="current-lang-label">🇬🇧 EN</span>
          <span style="font-size: 0.7rem; opacity: 0.7;">▼</span>
        </button>
        <ul class="lang-dropdown" id="lang-dropdown">
          <li class="lang-option active" data-lang="en">🇬🇧 English</li>
          <li class="lang-option" data-lang="de">🇩🇪 Deutsch</li>
          <li class="lang-option" data-lang="fr">🇫🇷 Français</li>
          <li class="lang-option" data-lang="it">🇮🇹 Italiano</li>
        </ul>
      </div>
      
      <!-- Mobile Menu Toggle Button -->
      <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle Navigation Menu">☰</button>
    </div>
  </div>
</header>
