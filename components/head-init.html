<!-- Inline Zero-Flash Theme & Language Initializer Component -->
<script>
  (function() {
    try {
      var savedTheme = localStorage.getItem('areena_theme');
      var theme = savedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.classList.add('preload');

      var supported = ['en', 'de', 'fr', 'it'];
      var pathParts = window.location.pathname.split('/').filter(Boolean);
      var pathLang = (pathParts[0] && supported.includes(pathParts[0].toLowerCase())) ? pathParts[0].toLowerCase() : null;
      var params = new URLSearchParams(window.location.search);
      var langParam = params.get('lang');
      var savedLang = localStorage.getItem('areena_lang');
      var browserLang = (navigator.language || '').slice(0, 2).toLowerCase();
      var lang = pathLang
               || (langParam && supported.includes(langParam.toLowerCase()) ? langParam.toLowerCase() : null)
               || (savedLang && supported.includes(savedLang) ? savedLang : null)
               || (supported.includes(browserLang) ? browserLang : 'en');

      document.documentElement.lang = lang;
      if (lang !== 'en') {
        document.documentElement.classList.add('i18n-loading');
      }
    } catch (e) {}
  })();
</script>
